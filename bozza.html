<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECHO Mappa – eventi d'arte a Firenze e in Toscana</title>
<meta name="description" content="Gli eventi d'arte della settimana di ECHO – florence art agenda, sulla mappa.">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Permanent+Marker&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--violet:#6b3fa3;--cream:#fff9dc;--ink:#2a1c3d;--soft:#5b4d70;--line:#e8dfc0;
--yellow:#ffd60a;--green:#19b36b;--red:#ff3b30;--grey:#b9b6c2}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.45 Quicksand,system-ui,sans-serif}
header{padding:18px max(4vw,16px) 10px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 18px}
h1{font:400 clamp(34px,6vw,54px)/1 Shrikhand,Georgia,serif;color:var(--violet);margin:0}
header p{margin:0;font-weight:600;color:var(--soft)}
.wrap{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;padding:8px max(4vw,16px) 24px;max-width:1400px}
.mapbox{align-self:start;border:5px solid #141414;box-shadow:8px 8px 0 #141414;border-radius:20px;overflow:hidden;background:#fff;position:relative}
#map{height:min(72vh,680px);min-height:380px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:10px 14px;font-size:14px;font-weight:600;border-top:2px solid var(--line)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.d{width:14px;height:14px;border-radius:50%;display:inline-block;border:2px solid var(--ink)}
.y{background:var(--yellow)}.g{background:var(--green)}.r{background:var(--red)}.p{background:var(--grey)}
.views{position:absolute;top:10px;right:10px;z-index:500;display:flex;gap:6px}
.views button{font:700 14px Quicksand,sans-serif;background:#fff;color:var(--violet);border:2px solid var(--violet);border-radius:999px;padding:8px 14px;min-height:40px;cursor:pointer}
.views button.on{background:var(--violet);color:#fff}
.fuori{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:500;font:700 15px Quicksand,sans-serif;background:var(--violet);color:#fff;border:0;border-radius:999px;padding:10px 18px;min-height:44px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25);white-space:nowrap}
.fuori[hidden]{display:none}
aside h2{font:400 26px/1.1 Shrikhand,Georgia,serif;color:var(--violet);margin:6px 0 2px}
.day{font-weight:700;color:var(--soft);margin:14px 0 6px;text-transform:capitalize}
.ev{all:unset;box-sizing:border-box;display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px;width:100%;background:#fff;border:2px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:8px;cursor:pointer}
.ev:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
.ev.sel{border-color:var(--violet)}
.ev .d{margin-top:3px}
.ev b{display:block}
.ev small{display:block;color:var(--soft);font-size:14px}
.st{font-size:13px;font-weight:700;margin-top:3px}
.st.r{color:var(--red);background:none}.st.g{color:var(--green);background:none}.st.y,.st.p{color:var(--soft);background:none}
.ev.past{opacity:.6}
.ev a{color:var(--violet);font-weight:700;font-size:14px}
.foot{font-size:14px;color:var(--soft);margin-top:10px}
.foot a{color:var(--violet);font-weight:700}
/* marker */
.leaflet-container{background:#1e6bff}
.mini{position:absolute;top:10px;z-index:1100;width:calc(50% - 15px);height:min(64%,360px);background:#fffdf5;border:4px solid #141414;border-radius:14px;box-shadow:5px 5px 0 #141414;overflow:hidden}
.mini[hidden]{display:none}
#mini{background:#e9e6dc}
#pIG{left:10px}#pOSM{right:10px}
.mini .x{position:absolute;top:5px;right:5px;z-index:900;width:34px;height:34px;border-radius:50%;border:3px solid #141414;background:#ffd60a;font:700 20px/1 Quicksand,sans-serif;cursor:pointer}
.igwrap,#mini{position:absolute;inset:0 0 36px 0;overflow:hidden}
#scheda{display:flex;flex-direction:column;overflow:auto;color:#141414}
.sk-st{padding:9px 46px 9px 12px;font:700 13px Quicksand,sans-serif;border-bottom:3px solid #141414}
.sk-b{padding:10px 12px 4px;display:flex;flex-direction:column;gap:5px}
.sk-l{font:400 21px/1.05 Shrikhand,Georgia,serif;text-transform:uppercase}
.sk-c{font:600 12px Quicksand,sans-serif;color:#5b4d70}
.sk-t{font:700 15px/1.2 Quicksand,sans-serif;font-style:italic;text-transform:uppercase;margin-top:4px}
.sk-p{font:600 13px/1.25 Quicksand,sans-serif}
.sk-q{font:700 13px/1.25 Quicksand,sans-serif;text-transform:capitalize}
.sk-e{margin-top:auto;padding:2px 12px 6px;font:400 19px Shrikhand,Georgia,serif;color:#6b3fa3}
.apri{position:absolute;left:0;right:0;bottom:0;height:36px;display:flex;align-items:center;justify-content:center;background:#141414;color:#fffdf5;font:700 14px Quicksand,sans-serif;text-decoration:none}
.musica{margin-left:auto;font:700 14px Quicksand,sans-serif;background:#ffd60a;color:#141414;border:3px solid #141414;border-radius:999px;padding:8px 14px;min-height:42px;cursor:pointer;box-shadow:3px 3px 0 #141414}
.musica.on{background:#141414;color:#ffd60a}
.num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:#141414;color:#fffdf5;font:700 13px Quicksand,sans-serif;font-style:normal;margin-right:5px;border:2px solid #fffdf5}
.ln{display:inline-block;width:26px;height:8px;border-radius:4px;border:2px solid #141414}
#giorni b{margin-right:4px}
.fermata{font:700 13px Quicksand,sans-serif;color:#141414;background:#fffdf5;border:2px solid #141414;border-radius:8px;padding:1px 7px;box-shadow:none;white-space:nowrap}
.fermata::before{display:none}
.nolab .fermata{display:none}
.mk{position:relative;width:34px;height:34px}
.mk i{position:absolute;inset:0;border-radius:50%;border:4px solid #141414;box-shadow:0 0 0 4px #fffdf5,0 0 0 7px #141414}
.mk.s-p i{width:22px;height:22px;inset:6px}
.mk .pulse{position:absolute;inset:0;border-radius:50%;animation:pulse 1.2s ease-out infinite}
.mk.blink i{animation:blink 1s steps(2,jump-none) infinite}
@keyframes pulse{0%{transform:scale(.7);opacity:.9}100%{transform:scale(2.6);opacity:0}}
@keyframes blink{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.mk .pulse,.mk.blink i{animation:none}}
.leaflet-popup-content{font:15px/1.4 Quicksand,sans-serif;color:var(--ink)}
.leaflet-popup-content b{font-size:16px}
@media(max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}#map{height:58vh}}
</style>
</head>
<body>
<header>
  <h1>ECHO Mappa</h1>
  <p id="sub">Gli eventi d'arte della settimana</p>
  <button id="musica" class="musica" type="button">♪ Musica</button>
</header>
<div class="wrap">
  <section class="mapbox">
    <div class="views"><button id="vFi" class="on" type="button">Centro</button><button id="vTo" type="button">Toscana</button></div>
    <div style="position:relative"><button id="fuori" class="fuori" type="button" hidden></button>
    <div id="pIG" class="mini" hidden><button class="x" type="button" aria-label="Chiudi">×</button><div class="igwrap" id="scheda"></div><a class="apri" id="igLink" target="_blank" rel="noopener">Apri su Instagram →</a></div>
    <div id="pOSM" class="mini" hidden><button class="x" type="button" aria-label="Chiudi">×</button><div id="mini"></div><a class="apri" id="goLink" target="_blank" rel="noopener">Portami lì →</a></div>
    <div id="map" role="region" aria-label="Mappa degli eventi"></div></div>
    <div class="legend" id="giorni"></div>
    <div class="legend">
      <span><i class="d y"></i>Questa settimana</span>
      <span><i class="d g"></i>Oggi</span>
      <span><i class="d r"></i>In corso adesso</span>
      <span><i class="d p"></i>Già passato</span>
    </div>
  </section>
  <aside>
    <h2 id="week">Settimana</h2>
    <div id="list"></div>
    <p class="foot">A cura di <a href="https://www.instagram.com/echo_agenda/" target="_blank" rel="noopener">ECHO – florence art agenda</a>. Organizzi un evento? Scrivici in DM. <a id="post" href="https://www.instagram.com/echo_agenda/" target="_blank" rel="noopener">Vedi il post della settimana</a></p>
  </aside>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
{
const DURATA_STD = 180; // minuti di "in corso" quando il post non dà l'ora di fine
const FIRENZE = [[43.7548,11.2362],[43.7856,11.2712]];
const FIRENZE_SVG = [[43.747,11.196],[43.792,11.312]];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const q = new URLSearchParams(location.search);
const adesso = () => q.get('simula') ? new Date(q.get('simula')) : new Date();
const toDate = (d, hm) => { const [h,m] = (hm||'00:00').split(':').map(Number); const x = new Date(d+'T00:00:00'); x.setHours(h,m,0,0); return x; };
const sameDay = (a,b) => a.toDateString() === b.toDateString();
const hm = d => d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});

function stato(e, now){
  const day = new Date(e.data+'T00:00:00');
  if (e.inizio){
    const a = toDate(e.data, e.inizio);
    const b = e.fine ? toDate(e.data, e.fine) : new Date(a.getTime()+DURATA_STD*60000);
    if (now >= a && now < b) return {k:'r', txt:'In corso adesso'+(e.fine?' fino alle '+e.fine:'')};
    if (now >= b) return {k:'p', txt:'Già passato'};
    if (sameDay(day, now)) return {k:'g', txt:'Oggi alle '+e.inizio};
    return {k:'y', txt:'Ore '+e.inizio+(e.fine?'–'+e.fine:'')};
  }
  const fineGiorno = new Date(day.getTime()+86400000);
  if (sameDay(day, now)) return {k:'g', txt:'Oggi'};
  if (now >= fineGiorno) return {k:'p', txt:'Già passato'};
  return {k:'y', txt:'Tutto il giorno'};
}

const TOSCANA = [[42.25,9.6],[44.55,12.45]];
const map = L.map('map', {scrollWheelZoom:false, minZoom:7, maxZoom:17, maxBounds:TOSCANA, maxBoundsViscosity:0.8, zoomSnap:0.25}).fitBounds(FIRENZE);
map.attributionControl.setPrefix('Mappa illustrata ECHO');
map.createPane('base').style.zIndex = 300;
const linee = L.layerGroup().addTo(map);
const COL_G = ['#ff3b30','#ff8a1f','#19b36b','#00a8c6','#7a3fd1','#ff7ac0','#1e6bff']; // dom..sab
const KX = Math.cos(43.77*Math.PI/180);
function otto(a, b, diagPrima){ // spezzata a 45/90 gradi tra due luoghi
  const dx = (b.lon-a.lon)*KX, dy = b.lat-a.lat, m = Math.min(Math.abs(dx), Math.abs(dy)), sx = Math.sign(dx), sy = Math.sign(dy);
  const mid = diagPrima ? [a.lat+sy*m, a.lon+sx*m/KX] : (Math.abs(dx) > Math.abs(dy) ? [a.lat, b.lon-sx*m/KX] : [b.lat-sy*m, a.lon]);
  return [[a.lat,a.lon], mid, [b.lat,b.lon]];
}
const etichette = () => document.getElementById('map').classList.toggle('nolab', map.getZoom() < 12.5);
map.on('zoomend', () => { etichette(); if (dati) render(); });
const svgLayer = (url, bounds) => fetch(url).then(r => r.text()).then(t => { const el = new DOMParser().parseFromString(t, 'image/svg+xml').documentElement; el.setAttribute('preserveAspectRatio','none'); return L.svgOverlay(el, bounds, {interactive:false, pane:'base'}); });
svgLayer('toscana.svg', TOSCANA).then(l => { l.addTo(map); l.bringToBack(); return svgLayer('firenze.svg', FIRENZE_SVG); }).then(l => l.addTo(map));
const col = {y:'var(--yellow)', g:'var(--green)', r:'var(--red)', p:'var(--grey)'};
let dati = null, markers = [], sel = null;

function icon(k){
  const anim = k==='g'||k==='r';
  return L.divIcon({className:'', iconSize:[34,34], iconAnchor:[17,17],
    html:'<div class="mk s-'+k+(anim?' blink':'')+'">'+(anim?'<span class="pulse" style="background:'+col[k]+'"></span>':'')+'<i style="background:'+col[k]+'"></i></div>'});
}
function gmaps(e){ return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(e.luogo+', '+e.citta); }

function render(){
  const now = adesso();
  markers.forEach(m => m.remove()); markers = [];
  const ev = dati.eventi.map((e,i) => ({...e, i, s: stato(e, now)}));
  // un pallino per luogo: vince lo stato più "caldo"
  const rank = {r:0,g:1,y:2,p:3}, perLuogo = {};
  ev.forEach(e => { const key = e.lat+','+e.lon; if (!perLuogo[key] || rank[e.s.k] < rank[perLuogo[key].s.k]) perLuogo[key] = e; });
  Object.values(perLuogo).sort((a,b)=>rank[b.s.k]-rank[a.s.k]).forEach(e => {
    const m = L.marker([e.lat,e.lon], {icon: icon(e.s.k), title: e.luogo, zIndexOffset: (3-rank[e.s.k])*100}).addTo(map)
      .bindPopup('<b>'+esc(e.luogo)+'</b><br>'+esc(e.citta)+'<br>'+esc(e.titolo)+'<br><span style="font-weight:700">'+esc(e.s.txt)+'</span><br><a href="'+gmaps(e)+'" target="_blank" rel="noopener">Portami lì →</a>');
    m.bindTooltip(esc(e.luogo), {permanent:true, direction:'right', offset:[16,0], className:'fermata'});
    m.on('click', () => { sel = e.i; highlight(); apri(e); });
    markers.push(m);
  });
  const giorni = {};
  ev.forEach(e => (giorni[e.data] ??= []).push(e));
  // una linea per ogni giorno: collega i luoghi in ordine di orario
  linee.clearLayers();
  // percorso consigliato: solo gli eventi ancora attivi del giorno, in ordine di orario, come fermate di una metro dell'arte
  const vicino = map.getZoom() >= 12.5, dentro = L.latLngBounds(FIRENZE_SVG);
  const attivi = d => giorni[d].filter(e => e.s.k !== 'p' && (!vicino || dentro.contains([e.lat,e.lon])));
  const giorno = Object.keys(giorni).sort().find(d => attivi(d).length);
  let txt = '<span>Nessun evento in programma qui: prova la vista Toscana</span>';
  if (giorno) {
    const g = new Date(giorno+'T00:00:00'), oggi = sameDay(g, now), tappe = [];
    attivi(giorno).sort((a,b) => (a.inizio||'99').localeCompare(b.inizio||'99')).forEach(e => { if (!tappe.some(t => t.lat===e.lat && t.lon===e.lon)) tappe.push(e); });
    let pts = [];
    for (let i = 0; i < tappe.length-1; i++) pts = pts.concat(otto(tappe[i], tappe[i+1], i % 2 === 0));
    if (pts.length) { L.polyline(pts, {color:'#141414', weight:15, lineJoin:'round', interactive:false}).addTo(linee); L.polyline(pts, {color:'#b98cff', weight:9, lineJoin:'round', interactive:false}).addTo(linee); }
    tappe.forEach((e,i) => L.marker([e.lat,e.lon], {icon: L.divIcon({className:'', iconSize:[22,22], iconAnchor:[-4,32], html:'<i class="num">'+(i+1)+'</i>'}), interactive:false, zIndexOffset:1000}).addTo(linee));
    txt = '<b>'+(oggi ? 'Percorso di oggi' : 'Prossimo percorso: '+g.toLocaleDateString('it-IT',{weekday:'long',day:'numeric'}))+'</b>'+tappe.map((e,i) => '<span><i class="num">'+(i+1)+'</i>'+esc(e.luogo)+(e.inizio ? ' · '+e.inizio : '')+'</span>').join('');
  }
  document.getElementById('giorni').innerHTML = txt;
  etichette();
  document.getElementById('list').innerHTML = Object.keys(giorni).sort().map(d =>
    '<div class="day">'+new Date(d+'T00:00:00').toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'})+'</div>'+
    giorni[d].map(e => '<button class="ev'+(e.s.k==='p'?' past':'')+'" data-i="'+e.i+'" type="button"><i class="d '+e.s.k+'"></i><span><b>'+esc(e.titolo)+'</b><small>'+esc(e.luogo)+' · '+esc(e.citta)+'</small><small>'+esc(e.tipo)+(e.persone?' · '+esc(e.persone):'')+'</small><span class="st '+e.s.k+'">'+esc(e.s.txt)+'</span></span></button>').join('')
  ).join('');
  highlight();
}
let miniMap = null, miniPin = null;
function apri(e){ // due mini schermate: il post Instagram e la mappa vera ingrandita
  suonoTocco();
  setTimeout(() => map.closePopup(), 0);
  const ig = document.getElementById('pIG'), os = document.getElementById('pOSM'); ig.hidden = os.hidden = false;
  const id = (dati.post.match(/\/p\/([^\/]+)/) || [])[1];
  const st = e.s || stato(e, adesso()), gg = new Date(e.data+'T00:00:00').toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});
  document.getElementById('scheda').innerHTML = '<div class="sk-st" style="background:'+col[st.k]+'">'+esc(st.txt)+'</div><div class="sk-b"><div class="sk-l">'+esc(e.luogo)+'</div><div class="sk-c">'+esc(e.citta)+'</div><div class="sk-t">'+esc(e.titolo)+'</div>'+(e.persone ? '<div class="sk-p">'+esc(e.persone)+'</div>' : '')+'<div class="sk-q">'+esc(e.tipo)+' · '+esc(gg)+(e.inizio ? ' · ore '+esc(e.inizio)+(e.fine ? '–'+esc(e.fine) : '') : '')+'</div></div><div class="sk-e">ECHO</div>';
  document.getElementById('igLink').href = 'https://www.instagram.com/p/'+id+'/?img_index='+(e.slide || 1);
  document.getElementById('goLink').href = gmaps(e);
  if (!miniMap){ miniMap = L.map('mini', {zoomControl:false}); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'&copy; OpenStreetMap'}).addTo(miniMap); miniMap.attributionControl.setPrefix(''); }
  miniMap.invalidateSize(); miniMap.setView([e.lat, e.lon], 17);
  if (miniPin) miniPin.remove();
  miniPin = L.circleMarker([e.lat, e.lon], {radius:11, color:'#141414', weight:4, fillColor:'#ff3b30', fillOpacity:1}).addTo(miniMap).bindTooltip(esc(e.luogo), {permanent:true, direction:'top', offset:[0,-10], className:'fermata'});
}
function chiudi(){ document.getElementById('pIG').hidden = document.getElementById('pOSM').hidden = true; }
document.querySelectorAll('.mini .x').forEach(b => b.onclick = chiudi);
map.on('click', chiudi);
function highlight(){ document.querySelectorAll('.ev').forEach(b => b.classList.toggle('sel', Number(b.dataset.i)===sel)); }

document.getElementById('list').addEventListener('click', ev => {
  const b = ev.target.closest('.ev'); if (!b) return;
  const e = dati.eventi[Number(b.dataset.i)]; sel = Number(b.dataset.i); highlight();
  map.setView([e.lat,e.lon], Math.max(map.getZoom(), 15));
  const m = markers.find(m => { const p = m.getLatLng(); return p.lat===e.lat && p.lng===e.lon; });
  apri(e);
  if (window.innerWidth < 860) document.getElementById('map').scrollIntoView({behavior:'smooth'});
});
const vFi = document.getElementById('vFi'), vTo = document.getElementById('vTo'), fuori = document.getElementById('fuori');
const nFuori = () => dati ? dati.eventi.filter(e => !L.latLngBounds(FIRENZE).contains([e.lat,e.lon])).length : 0;
function badge(show){ const n = nFuori(); fuori.hidden = !show || n === 0; fuori.textContent = '+' + n + (n === 1 ? ' evento' : ' eventi') + ' fuori dal centro →'; }
vFi.onclick = () => { map.fitBounds(FIRENZE); vFi.classList.add('on'); vTo.classList.remove('on'); badge(true); };
vTo.onclick = () => { map.fitBounds(L.latLngBounds(dati.eventi.map(e=>[e.lat,e.lon])).pad(0.15)); vTo.classList.add('on'); vFi.classList.remove('on'); badge(false); };
fuori.onclick = () => vTo.onclick();

// --- musica generata dal vivo nel browser (nessun file audio): groove "garage" morbido, piano elettrico, basso rotondo e il motivo ECHO lanciato nell'eco ---
const Mu = {ctx:null, on:false, next:0, bar:0, timer:null};
const BPMM = 110, BT = 60/BPMM, S16 = BT/4, hzN = n => 440*Math.pow(2,(n-69)/12);
const CHM = [[57,61,64,68],[54,57,61,64],[57,61,62,66],[59,62,66,69]], RTM = [42,38,35,40];
function muInit(){
  const c = Mu.ctx = new (window.AudioContext || window.webkitAudioContext)();
  Mu.out = c.createGain(); Mu.out.gain.value = 1.15;
  const cmp = c.createDynamicsCompressor(); cmp.threshold.value = -10; cmp.ratio.value = 4; Mu.out.connect(cmp); cmp.connect(c.destination);
  // riverbero: una coda di rumore che sfuma, per dare aria
  const len = Math.floor(c.sampleRate*2.6), buf = c.createBuffer(2, len, c.sampleRate);
  for (let ch = 0; ch < 2; ch++){ const d = buf.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/len, 3); }
  const rev = c.createConvolver(); rev.buffer = buf; const rg = c.createGain(); rg.gain.value = 0.22; rev.connect(rg); rg.connect(Mu.out);
  Mu.bus = c.createGain(); Mu.bus.connect(Mu.out);                 // secco
  Mu.riv = c.createGain(); Mu.riv.connect(Mu.out); Mu.riv.connect(rev); // con riverbero
  Mu.echo = c.createGain(); // eco che rimbalza sinistra/destra
  const dl = c.createDelay(2), dr = c.createDelay(2), fb = c.createGain(), pl = c.createStereoPanner(), pr = c.createStereoPanner(), lp = c.createBiquadFilter();
  dl.delayTime.value = BT*0.75; dr.delayTime.value = BT*0.75; fb.gain.value = 0.42; pl.pan.value = -0.8; pr.pan.value = 0.8; lp.frequency.value = 2600;
  Mu.echo.connect(dl); dl.connect(pr); pr.connect(Mu.riv); dl.connect(lp); lp.connect(dr); dr.connect(pl); pl.connect(Mu.riv); dr.connect(fb); fb.connect(dl);
  const nb = Mu.rum = c.createBuffer(1, c.sampleRate, c.sampleRate), nd = nb.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random()*2-1;
}
function inv(g, t, vol, d, att){ g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+(att || 0.006)); g.gain.exponentialRampToValueAtTime(0.0001, t+d); }
function piano(n, t, d, vol, pan, dest){ // piano elettrico: una sinusoide "colorata" da un'altra
  const c = Mu.ctx, f = hzN(n), o = c.createOscillator(), m = c.createOscillator(), mg = c.createGain(), g = c.createGain(), p = c.createStereoPanner();
  o.frequency.value = f; m.frequency.value = f; mg.gain.setValueAtTime(f*1.3, t); mg.gain.exponentialRampToValueAtTime(f*0.05, t+0.5);
  m.connect(mg); mg.connect(o.frequency); inv(g, t, vol, d); p.pan.value = pan || 0;
  o.connect(g); g.connect(p); p.connect(dest || Mu.riv); o.start(t); m.start(t); o.stop(t+d+0.05); m.stop(t+d+0.05);
}
function basso(n, t, d, vol){
  const c = Mu.ctx, f = hzN(n), o = c.createOscillator(), o2 = c.createOscillator(), g = c.createGain(), lp = c.createBiquadFilter();
  o.frequency.value = f; o2.type = 'triangle'; o2.frequency.value = f*2; lp.frequency.value = 420; const g2 = c.createGain(); g2.gain.value = 0.3;
  inv(g, t, vol, d, 0.008); o.connect(g); o2.connect(g2); g2.connect(g); g.connect(lp); lp.connect(Mu.bus); o.start(t); o2.start(t); o.stop(t+d+0.05); o2.stop(t+d+0.05);
}
function cassa(t, vol){
  const c = Mu.ctx, o = c.createOscillator(), g = c.createGain(); o.frequency.setValueAtTime(116, t); o.frequency.exponentialRampToValueAtTime(46, t+0.09);
  inv(g, t, vol, 0.3, 0.003); o.connect(g); g.connect(Mu.bus); o.start(t); o.stop(t+0.35);
}
function fruscio(t, d, vol, tipo, freq, pan, dest){
  const c = Mu.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(), p = c.createStereoPanner();
  s.buffer = Mu.rum; f.type = tipo; f.frequency.value = freq; f.Q.value = 0.9; p.pan.value = pan || 0;
  s.connect(f); f.connect(g); g.connect(p); p.connect(dest || Mu.bus); s.start(t, Math.random()*0.5, d+0.05); return g;
}
function mani(t, vol){ // battimani: tre colpetti ravvicinati e una coda
  const g = fruscio(t, 0.25, vol, 'bandpass', 1500, -0.1, Mu.riv);
  g.gain.setValueAtTime(0.0001, t);
  [0, 0.011, 0.022].forEach(o => { g.gain.setValueAtTime(vol, t+o); g.gain.exponentialRampToValueAtTime(vol*0.2, t+o+0.009); });
  g.gain.setValueAtTime(vol, t+0.032); g.gain.exponentialRampToValueAtTime(0.0001, t+0.24);
}
function piatto(t, vol, d, pan){ const g = fruscio(t, d, vol, 'highpass', 7000, pan); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t+d); }
function tappeto(ch, t, d, vol){
  const c = Mu.ctx, g = c.createGain(), lp = c.createBiquadFilter(); lp.frequency.value = 1300;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+0.9); g.gain.setValueAtTime(vol, t+d-1); g.gain.exponentialRampToValueAtTime(0.0001, t+d);
  ch.forEach(n => [-6, 6].forEach(det => { const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.value = hzN(n); o.detune.value = det; o.connect(lp); o.start(t); o.stop(t+d+0.05); }));
  lp.connect(g); g.connect(Mu.riv);
}
function voce(n, t, d, vol, eco){ // la voce che canta il motivo
  const c = Mu.ctx, g = c.createGain(), e = c.createGain(); e.gain.value = eco; inv(g, t, vol, d, 0.012);
  [[1, 1], [2, 0.25]].forEach(a => { const o = c.createOscillator(), og = c.createGain(); o.frequency.value = hzN(n)*a[0]; og.gain.value = a[1]; o.connect(og); og.connect(g); o.start(t); o.stop(t+d+0.05); });
  g.connect(Mu.riv); g.connect(e); e.connect(Mu.echo);
}
const FR = {1:[[0,76,3],[3,73,3],[6,69,6]], 2:[[0,76,3],[3,73,3],[6,71,6]], 3:[[0,78,3],[3,76,3],[6,73,4],[10,69,6]], 4:[[2,69,2],[4,73,2],[6,76,8]]};
function frase(k, t, vol, eco){ FR[k].forEach(m => voce(m[1], t+m[0]*S16, m[2]*S16*1.6, vol, eco)); }
function motivo(t){ frase(1, t, 0.17, 1); }
// giro di 24 battute: 4 sospese (solo accordi ed eco), 20 col ritmo
const CANTO = {0:[1,1], 2:[2,1], 8:[1,.5], 10:[3,.5], 12:[3,.5], 13:[1,.5], 14:[4,.5], 15:[2,.8], 16:[3,.5], 17:[1,.5], 18:[4,.5], 19:[2,.8], 20:[3,.5], 21:[1,.5], 22:[4,.5], 23:[2,1]};
function battuta(b, t){
  const k = b % 24, ch = CHM[b % 4], root = RTM[b % 4], ritmo = k >= 4;
  if (ritmo){
    [0,3,6,10,13].forEach(p => ch.forEach((n, j) => piano(n, t+p*S16, 0.5, 0.085, -0.35+0.23*j)));
    [[0,2,0],[3,1,12],[6,2,0],[8,1,7],[10,2,12],[14,2,10]].forEach(x => { if (!(k < 8 && (x[0] === 8 || x[0] === 14))) basso(root+x[2], t+x[0]*S16, x[1]*S16*0.95, 0.3); });
    for (let q = 0; q < 4; q++){ cassa(t+q*BT, 0.42); piatto(t+q*BT+BT/2, 0.05, 0.09, 0.25); }
    mani(t+BT, 0.14); mani(t+3*BT, 0.14);
    for (let p = 0; p < 16; p++) piatto(t+p*S16+(p % 2 ? 0.012 : 0), p % 4 === 2 ? 0.022 : 0.014, 0.03, -0.3);
    if (k >= 12) tappeto(ch.slice(1).map(n => n+12), t, BT*4+1.2, 0.02);
  } else {
    ch.forEach((n, j) => piano(n, t+j*0.018, BT*4, 0.11, -0.4+0.26*j));
    tappeto(ch.slice(1).map(n => n+12).concat(ch[0]), t, BT*4+1.2, 0.035);
    if (b >= 4) basso(root, t, BT*3.6, 0.14);
    if (k >= 2) for (let q = 0; q < 4; q++) piatto(t+q*BT+BT/2, 0.035, 0.09, 0.25);
  }
  if (CANTO[k]) frase(CANTO[k][0], t, ritmo ? 0.13 : 0.17, CANTO[k][1]);
}
function muTick(){ while (Mu.next < Mu.ctx.currentTime + 0.6){ battuta(Mu.bar++, Mu.next); Mu.next += 4*BT; } }
const btnMu = document.getElementById('musica');
btnMu.onclick = () => {
  if (!Mu.ctx) muInit();
  Mu.on = !Mu.on; btnMu.classList.toggle('on', Mu.on); btnMu.textContent = Mu.on ? '♪ Musica: sì' : '♪ Musica';
  if (Mu.on){ Mu.ctx.resume(); Mu.out.gain.value = 1.15; Mu.next = Mu.ctx.currentTime + 0.1; Mu.bar = 0; muTick(); Mu.timer = setInterval(muTick, 200); }
  else { clearInterval(Mu.timer); Mu.out.gain.value = 0; }
};
const suonoTocco = () => { if (Mu.on) motivo(Mu.ctx.currentTime + 0.03); };
fetch('eventi-bozza.json?'+Date.now()).then(r => r.json()).then(d => {
  dati = d;
  document.getElementById('week').textContent = 'Settimana '+d.settimana;
  if (d.post) document.getElementById('post').href = d.post;
  render(); badge(true); setInterval(render, 60000);
}).catch(() => { document.getElementById('list').textContent = 'Eventi non disponibili in questo momento.'; });
}
